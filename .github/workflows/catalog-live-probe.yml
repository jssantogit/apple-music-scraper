name: Live catalog BR-US probe (experimental)

# Temporary explicit one-off probe of public catalog metadata.
# This workflow is intentionally separate from the offline unit-test gate.
on:
  push:
    branches:
      - audit/apple-catalog-hardening-20261117
    paths:
      - .github/workflows/catalog-live-probe.yml
      - scripts/catalog_live_probe.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe Brazil and US (small read-only sample)
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m scripts.catalog_live_probe --countries br us
