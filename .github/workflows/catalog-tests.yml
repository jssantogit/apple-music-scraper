name: Catalog unit tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m pytest -q tests/
      - name: One-time public catalog probe (non-blocking, separate from offline gate)
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request' && github.head_ref == 'audit/apple-catalog-hardening-20261117'
        continue-on-error: true
        run: python -m scripts.catalog_live_probe --countries br us
