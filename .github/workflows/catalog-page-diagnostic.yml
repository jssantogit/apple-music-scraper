name: Search pagination upstream diagnostic

# Read-only diagnostic for anomalous offset overlap. It never stores raw
# Apple payloads or bearer tokens, and is not a substitute for the 51-route gate.
on:
  pull_request:
    paths:
      - scripts/catalog_page_probe.py
      - .github/workflows/catalog-page-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-offsets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify diagnostic contract
        run: python -m pytest -q tests/test_catalog_page_probe.py
      - name: Compare raw catalog pages without printing tokens or payloads
        run: python -m scripts.catalog_page_probe --country in --term 'Yo-Yo Ma' --limits 2,5,10 --rounds 2
